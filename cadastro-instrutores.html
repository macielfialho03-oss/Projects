<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro de Instrutores</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark"><div class="container"><a class="navbar-brand" href="index.html">Academia Fit</a><button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="menu"><div class="navbar-nav ms-auto"><a class="nav-link" href="index.html">Início</a><a class="nav-link" href="cadastro-alunos.html">Cadastrar aluno</a><a class="nav-link" href="listar-alunos.html">Listar alunos</a><a class="nav-link active" href="cadastro-instrutores.html">Cadastrar instrutor</a><a class="nav-link" href="listar-instrutores.html">Listar instrutores</a></div></div></div></nav>
  <main class="container py-5">
    <h1 class="page-title mb-4">Cadastro de Instrutor</h1>
    <form class="card p-4 form-cadastro"><div class="row g-3">
      <div class="col-md-6"><label class="form-label">Nome do instrutor</label><input class="form-control" required></div>
      <div class="col-md-6"><label class="form-label">Especialidade</label><input class="form-control" required></div>
      <div class="col-md-6"><label class="form-label">E-mail</label><input type="email" class="form-control" required></div>
      <div class="col-md-6"><label class="form-label">Telefone</label><input class="form-control" required></div>
      <div class="col-md-6"><label class="form-label">Turno</label><select class="form-select" required><option value="">Escolha...</option><option>Manhã</option><option>Tarde</option><option>Noite</option></select></div>
    </div><button class="btn btn-success mt-4" type="submit">Cadastrar instrutor</button></form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/script.js"></script>
</body>
</html>
