<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro de Alunos</title>
  <link href="assets/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark"><div class="container"><a class="navbar-brand" href="index.html">Alitargym</a><button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="menu"><div class="navbar-nav ms-auto"><a class="nav-link" href="index.html">Início</a><a class="nav-link active" href="cadastro-alunos.html">Cadastrar aluno</a><a class="nav-link" href="listar-alunos.html">Listar alunos</a><a class="nav-link" href="cadastro-instrutores.html">Cadastrar instrutor</a><a class="nav-link" href="listar-instrutores.html">Listar instrutores</a></div></div></div></nav>
  <main class="container py-5">
    <h1 class="page-title mb-4">Cadastro de Aluno</h1>
    <form class="card p-4 form-cadastro">
      <div class="row g-3">
        <div class="col-md-6"><label class="form-label">Nome completo</label><input name="telefone" class="form-control" required></div>
        <div class="col-md-6"><label class="form-label">CPF</label><input name="cpf" class="form-control" placeholder="000.000.000-00" required></div>
        <div class="col-md-6"><label class="form-label">E-mail</label><input name="email" type="email" class="form-control" required></div>
        <div class="col-md-6"><label class="form-label">Telefone</label><input class="form-control" required></div>
        <div class="col-md-6"><label class="form-label">Plano contratado</label><select name="plano" class="form-select" required><option value="">Escolha...</option><option>Básico</option><option>Completo</option><option>Premium</option></select></div>
      </div>
      <button class="btn btn-success mt-4" type="submit">Cadastrar aluno</button>
    </form>
  </main>
  <script src="assets/bootstrap.bundle.min.js"></script><script src="js/script.js"></script>
</body>
</html>
